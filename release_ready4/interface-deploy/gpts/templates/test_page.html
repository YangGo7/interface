<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dental AI Test (Live)</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #e0e0e0;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .btn {
            background: #007bff;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            display: inline-block;
            cursor: pointer;
            border: none;
            font-size: 16px;
        }

        .btn:hover {
            background: #0056b3;
        }

        input[type="file"] {
            display: none;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            display: none;
            margin: 20px auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
    <script>
        function startUpload() {
            document.getElementById('form').submit();
            document.getElementById('status').style.display = 'block';
            document.getElementById('uploadBtn').style.display = 'none';
            document.getElementById('msg').innerText = "분석 중입니다... (약 10-20초 소요)";
        }
    </script>
</head>

<body>
    <div class="card">
        <h2>🔭 실시간 분석 테스트</h2>
        <p>파일을 선택하면 분석 후 결과 페이지로 자동 이동합니다.</p>

        <!-- Standard Form Submission -->
        <!-- Action URL will be set by JS or Jinja? We use JS to retrieve session ID from URL -->
        <form id="form" method="POST" enctype="multipart/form-data">
            <label for="file" class="btn" id="uploadBtn">사진 선택 및 시작</label>
            <input type="file" id="file" name="file" accept="image/*" onchange="startUpload()">
        </form>

        <div id="status" style="display:none;">
            <div class="loader"></div>
            <p id="msg">업로드 중...</p>
        </div>
    </div>

    <script>
        // Set the form action dynamically based on current session_id in URL
        const sessionId = window.location.pathname.split('/').pop();
        // Append ?render_html=1 to trigger the HTML response mode
        document.getElementById('form').action = `/api/v2/upload_process/${sessionId}?render_html=1`;
    </script>
</body>

</html>
