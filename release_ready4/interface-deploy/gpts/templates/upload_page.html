<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dental X-Ray Upload</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .btn {
            background-color: #0071e3;
            color: white;
            padding: 14px 28px;
            border-radius: 24px;
            border: none;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            background-color: #005bb5;
        }

        input[type="file"] {
            display: none;
        }

        h2 {
            margin-top: 0;
            color: #1d1d1f;
        }

        p {
            color: #86868b;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        .status {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 8px;
        }

        .status.loading {
            background: #e3f2fd;
            color: #1565c0;
        }

        .status.success {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #1565c0;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>🦷 X-Ray Upload</h2>
        <p>Please select a panoramic X-ray image for analysis.</p>

        <label for="file" class="btn" id="uploadBtn">Select Image</label>
        <input type="file" id="file" name="file" accept="image/*">

        <div id="status" class="status" style="display:none;"></div>
    </div>

    <script>
        const fileInput = document.getElementById('file');
        const uploadBtn = document.getElementById('uploadBtn');
        const status = document.getElementById('status');

        fileInput.addEventListener('change', function () {
            if (!this.files.length) return;

            uploadBtn.textContent = 'Uploading...';
            uploadBtn.style.pointerEvents = 'none';
            status.style.display = 'block';
            status.className = 'status loading';
            status.innerHTML = '<span class="spinner"></span> Uploading...';

            const file = this.files[0];
            const formData = new FormData();
            formData.append('file', file);

            const xhr = new XMLHttpRequest();
            const uploadUrl = window.location.pathname.replace('/upload_page/', '/upload_process/');

            xhr.open('POST', uploadUrl, true);

            // When upload is SENT (not waiting for response)
            xhr.upload.onloadstart = function () {
                status.innerHTML = '<span class="spinner"></span> Sending to server...';
            };

            // When upload completes (file sent to server)
            xhr.upload.onload = function () {
                status.className = 'status success';
                status.innerHTML = '✅ Upload Complete! Analysis has started.<br>Please return to GPTs and type <strong>"I uploaded it"</strong>.';

                // Auto close after 2 seconds
                setTimeout(function () {
                    window.close();
                }, 2000);
            };

            xhr.onerror = function () {
                status.innerHTML = '❌ Upload failed. Please try again.';
                uploadBtn.textContent = 'Select Again';
                uploadBtn.style.pointerEvents = 'auto';
            };

            xhr.send(formData);
        });
    </script>
</body>

</html>
